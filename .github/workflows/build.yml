name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Auto-Fix Package Imports for ZenLauncher
        run: |
          find ZalithLauncher/src -type f \( -name "*.kt" -o -name "*.java" \) -exec sed -i 's/com\.movtery\.zalithlauncher\.R/com.zenlauncher.app.R/g' {} +
          find ZalithLauncher/src -type f \( -name "*.kt" -o -name "*.java" \) -exec sed -i 's/com\.movtery\.zalithlauncher\.BuildKeys/com.zenlauncher.app.BuildKeys/g' {} +
          find ZalithLauncher/src -type f \( -name "*.kt" -o -name "*.java" \) -exec sed -i 's/com\.movtery\.zalithlauncher\.BuildConfig/com.zenlauncher.app.BuildConfig/g' {} +

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com{version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" | tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*

      - name: Setup Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleDebug -Darch=arm64

      - name: Upload ZenLauncher APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenLauncher-arm64-apk
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          
